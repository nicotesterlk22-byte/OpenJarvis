plugins { id 'com.android.application' }

def getVersionCode = {
    if (project.hasProperty('versionCode') && project.property('versionCode').toString().isInteger()) {
        return project.property('versionCode').toInteger()
    }
    if (System.getenv('GITHUB_RUN_NUMBER') != null && System.getenv('GITHUB_RUN_NUMBER').isInteger()) {
        return System.getenv('GITHUB_RUN_NUMBER').toInteger()
    }
    return 1
}

android {
    namespace 'com.openjarvis.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.openjarvis.mobile"
        minSdk 26
        targetSdk 34
        versionCode getVersionCode()
        versionName "1.0.${getVersionCode()}"
        buildConfigField "String", "SERVER_URL", "\"${project.findProperty('serverUrl') ?: 'https://openjarvis.up.railway.app'}\""
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            storeFile file(System.getenv('JARVIS_KEYSTORE') ?: 'keystore.p12')
            storePassword System.getenv('JARVIS_KEYSTORE_PASSWORD') ?: ''
            storeType 'PKCS12'
            keyAlias System.getenv('JARVIS_KEY_ALIAS') ?: ''
            keyPassword System.getenv('JARVIS_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
