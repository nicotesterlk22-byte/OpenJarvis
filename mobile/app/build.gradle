plugins { id 'com.android.application' }

android {
    namespace 'com.openjarvis.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.openjarvis.mobile"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "SERVER_URL", "\"${project.findProperty('serverUrl') ?: 'https://openjarvis.up.railway.app'}\""
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            storeFile file(System.getenv('JARVIS_KEYSTORE') ?: 'keystore.p12')
            storePassword System.getenv('JARVIS_KEYSTORE_PASSWORD') ?: ''
            storeType 'PKCS12'
            keyAlias System.getenv('JARVIS_KEY_ALIAS') ?: ''
            keyPassword System.getenv('JARVIS_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
